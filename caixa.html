<script>
/* Caixa VK — frente de caixa rápida. Grava cada dinheiro recebido em "caixa_app_recebimentos" (mesmo Firebase do Livro Caixa);

const erro = (t,x)=>aviso({titulo:t,texto:x,tipo:'erro'});
const confirmar = (t,x,ok='Sim, confirmar',nao='Voltar')=>aviso({titulo:t,texto:x,botoes:[{t:ok,v:true},{t:nao,v:false,cls:'sec'}]});

function iniciar(){
  if(typeof firebase==='undefined'){ $('#app').innerHTML='<div class="card"><h1>Sem internet</h1><p>Abra o app uma vez com internet para carregar.</p></div>'; return; }
  firebase.initializeApp(CONFIG); auth=firebase.auth(); db=firebase.firestore();
  db.settings({ experimentalAutoDetectLongPolling:true, cacheSizeBytes:firebase.firestore.CACHE_SIZE_UNLIMITED });
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  window.addEventListener('online',()=>{ offline=false; desenhar(); }); window.addEventListener('offline',()=>{ offline=true; desenhar(); });
  auth.onAuthStateChanged(u=>{ usuario=u; unsubs.forEach(f=>f()); unsubs=[]; if(u) assinar(); else { pedidos=[]; meus=[]; conf=null; vkLista=[]; } desenhar(); });
}
function assinar(){
  const falha = e=>console.error(e);
  unsubs.push(db.collection('caixa_app_pedidos').onSnapshot(s=>{ pedidos=s.docs.map(d=>({id:d.id,...d.data()})); desenhar(); },falha));
  unsubs.push(db.collection('caixa_app_config').doc('geral').onSnapshot(s=>{ conf=s.exists?s.data():null;
    /* guarda o último acesso ao Industrial que funcionou; se o Livro Caixa publicar vazio por engano, o app continua funcionando */
    try{ if(conf&&conf.vk&&conf.vk.firebaseConfig) localStorage.setItem('caixa_vkcfg',JSON.stringify(conf.vk)); else if(conf){ const g=JSON.parse(localStorage.getItem('caixa_vkcfg')||'null'); if(g) conf=Object.assign({},conf,{vk:g}); } }catch(e){}
    desenhar(); },falha));
  unsubs.push(db.collection('caixa_app_recebimentos').where('uid','==',usuario.uid).onSnapshot(s=>{ meus=s.docs.map(d=>({id:d.id,pendente:d.metadata.hasPendingWrites,...d.data()})).sort((a,b)=>String(b.criadoEm||'').localeCompare(String(a.criadoEm||''))); desenhar(); },falha));
}
async function entrar(){
  const e=$('#lEmail').value.trim(), s=$('#lSenha').value; if(!e||!s){ await erro('Faltou algo','Digite o e-mail e a senha.'); return; }
  const b=$('#bEntrar'); b.disabled=true; b.textContent='Entrando…';
  try{ await auth.signInWithEmailAndPassword(e,s); }catch(x){ b.disabled=false; b.textContent='Entrar'; await erro('Não consegui entrar', /network/i.test(x.code||x.message)?'Sem internet. Tente de novo quando tiver sinal.':'E-mail ou senha incorretos.'); }
}
function sair(){ confirmar('Sair da conta?','Você vai precisar entrar de novo.','Sair','Ficar').then(ok=>{ if(ok) auth.signOut(); }); }

/* quanto já foi recebido aqui no app e ainda não apareceu no Livro Caixa */
const chavePed = p=>p.vkPedidoId||p.refId||p.id;
function jaNoApp(p, incluirImportados){ return r2(meus.filter(m=>(m.vkPedidoId||m.refId)===chavePed(p) && (m.status==='novo'||m.status==='sem_conta'||(incluirImportados&&m.status==='importado'))).reduce((s,m)=>s+(Number(m.valor)||0),0)); }
function restanteDe(p){ return r2((Number(p.restante)||0) - jaNoApp(p, p.origemVK)); }

async function vkDb(){
  if(!conf || !conf.vk) throw new Error('O acesso ao Industrial ainda não foi publicado. Abra o Livro Caixa uma vez e tente de novo.');
  if(!vkApp) vkApp = firebase.initializeApp(conf.vk.firebaseConfig,'vk-industrial');
  const a = vkApp.auth(); if(!a.currentUser) await a.signInWithEmailAndPassword(conf.vk.email, conf.vk.senha);
  return vkApp.firestore();
}
/* ---------- pedidos direto do Industrial (quando o cliente ainda não está no financeiro) ---------- */
async function buscarIndustrial(){
  if(vkBuscando) return;
  if(!conf || !conf.vk){ await erro('Industrial não configurado','Abra o Livro Caixa uma vez (ele publica o acesso ao VK Industrial) e tente de novo.\nSe o problema continuar, confira se a Integração VK Industrial está configurada lá.'); return; }
  vkBuscando=true; desenhar();
  try{
    const vdb = await vkDb();
    const [ps, cs] = await Promise.all([ vdb.collection('pedidos').get({source:'server'}), vdb.collection('clientes').get({source:'server'}) ]);
    const clientes = {}; cs.docs.forEach(d=>clientes[d.id]=d.data());
    const conhecidos = new Set(pedidos.map(p=>p.vkPedidoId).filter(Boolean));
    vkLista = ps.docs.map(d=>({id:d.id,...d.data()})).filter(p=>{
      const f=p.financeiro||{};
      if(p.status==='cancelado'||p.bonificacao||p.isBonificacao||p.pdv||conhecidos.has(p.id)) return false;
      if(p.pagamentoDinheiro||p.pagamentoPix||p.pagamentoCartao||p.pagamentoBoleto||f.status==='pago') return false;
      if(p.vendaDireta && p.pagamentoRealizado) return false;
      return Number(p.valorTotal)>0 && String(p.numero==null?'':p.numero).trim()!=='';
    }).map(p=>{
      const f=p.financeiro||{}, cli=(clientes[p.clienteId]||{}).nome || p.clienteNome || (p.vendaDireta?'Venda Direta':'(sem cliente)');
      const total=Number(p.valorTotal)||0, pago=Math.min(total,Number(f.valorPago)||0);
      return { id:'vk_'+p.id, kind:'vk', origemVK:true, refId:'', vkPedidoId:p.id, cliente:cli, numero:String(p.numero), descricao:'Pedido N° '+p.numero+' — '+cli, valor:total, recebido:pago, restante:r2(total-pago), vencimento:f.vencimento||p.dataEntrega||'', _ord:String(p.dataEntrega||p.data||'') };
    }).sort((a,b)=>b._ord.localeCompare(a._ord));
    const d=new Date(); vkHora=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    vkBuscando=false; desenhar();
    if(!vkLista.length) await aviso({titulo:'Nenhum pedido novo',texto:'Não achei no Industrial nenhum pedido em aberto que já não esteja na lista do financeiro.',tipo:'ok'});
  }catch(e){ vkBuscando=false; desenhar(); await erro('Não consegui buscar no Industrial', /network/i.test(e.code||e.message)?'Sem internet. Tente de novo quando tiver sinal.':'Motivo: '+(e.message||e)); }
}

/* ---------- receber ---------- */
let sel=null, salvando=false;
function abrirReceber(id){
  sel = pedidos.concat(vkLista).find(p=>p.id===id); if(!sel) return;
  const rest = restanteDe(sel); if(!(rest>0.009)){ erro('Já recebido','Esse pedido não tem mais valor a receber aqui.'); sel=null; return; }
  $('#app').dataset.tela='receber'; desenhar();
  setTimeout(()=>{ const i=$('#rValor'); if(i){ i.focus(); i.select(); } },50);
}
function atualizarCalc(){
  const rest = restanteDe(sel), v = num($('#rValor').value), c=$('#rCalc');
  if(!(v>0)){ c.className='calc'; c.textContent=''; return; }
  if(v>rest+0.009){ c.className='calc troco'; c.textContent='Troco a devolver: '+brl(r2(v-rest)); }
  else if(v<rest-0.009){ c.className='calc falta'; c.textContent='Fica faltando: '+brl(r2(rest-v)); }
  else { c.className='calc exato'; c.textContent='✔ Paga o pedido todo'; }
}
async function confirmarRecebimento(){
  if(salvando||!sel) return;
  const p=sel, rest=restanteDe(p), entregue=num($('#rValor').value), data=$('#rData').value;
  if(!(entregue>0)) return erro('Falta o valor','Digite quanto o cliente entregou em dinheiro.');
  if(!data) return erro('Falta a data','Escolha a data do recebimento.');
  if(data>hoje()) return erro('Data no futuro','A data não pode ser depois de hoje.');
  const aplicado=Math.min(r2(entregue), rest), troco=r2(Math.max(0,entregue-rest)), falta=r2(rest-aplicado);
  let txt=p.cliente+'\n'+(p.numero?'Pedido N° '+p.numero+'\n':'')+'Recebido em dinheiro: '+brl(aplicado);
  if(troco>0) txt+='\nCliente entregou '+brl(entregue)+' — devolver troco de '+brl(troco);
  txt+= falta>0.009 ? '\nFica faltando: '+brl(falta) : '\nO pedido fica TOTALMENTE pago.';
  if(!(await confirmar('Confirmar recebimento?',txt,'✅ Sim, receber','Voltar'))) return;
  salvando=true; $('#bOk').disabled=true;
  const id=uuid();
  const doc={ id, kind:p.kind, refId:p.refId||'', vkPedidoId:p.vkPedidoId||'', cliente:p.cliente||'', numero:p.numero||'', descricao:p.descricao||'', vencimento:p.vencimento||'', valor:aplicado, valorEntregue:r2(entregue), troco, forma:'dinheiro', data, status:'novo', email:usuario.email, uid:usuario.uid, criadoEm:new Date().toISOString() };
  if(p.kind==='vk') doc.valorTotal = Number(p.valor)||0;
  const pr=db.collection('caixa_app_recebimentos').doc(id).set(doc);
  pr.catch(e=>erro('Não consegui enviar','O recebimento ficou guardado no aparelho. Motivo: '+(e.message||e)));
  await Promise.race([pr.catch(()=>{}), new Promise(r=>setTimeout(r,1500))]);
  salvando=false; sel=null; delete $('#app').dataset.tela; busca='';
  meus.unshift({...doc,pendente:true}); desenhar();
  await aviso({titulo:'✔ Recebido!',tipo:'ok',texto: (offline?'Sem sinal agora. Ficou guardado no aparelho e vai sozinho quando o sinal voltar.\n':'') + brl(aplicado)+' de '+doc.cliente+(troco>0?'\nDevolva '+brl(troco)+' de troco.':'')+'\nO Livro Caixa lança no financeiro sozinho (conta Caixa físico) quando for aberto.'});
}
function voltar(){ sel=null; if(document.body.classList.contains('desk')) busca=''; delete $('#app').dataset.tela; desenhar(); }
async function desfazer(id){
  const m=meus.find(x=>x.id===id); if(!m||m.status==='importado') return;
  if(!(await confirmar('Desfazer este recebimento?',m.cliente+' — '+brl(m.valor)+'\nEle ainda não entrou no financeiro. Desfaça só se foi lançado errado.','Sim, desfazer','Voltar'))) return;
  try{ await db.collection('caixa_app_recebimentos').doc(id).delete(); }catch(e){ erro('Não consegui desfazer','Motivo: '+(e.message||e)); }
}

async function carregarProdutos(){

  try{ const cs=await vdb.collection('categorias').get({source:'server'}); vkCats=cs.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.nome).sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR')); }catch(e){ vkCats=[]; }
  vkProdutos=ps.docs.map(d=>({id:d.id,...d.data()})).filter(p=>!p.arquivado && p.nome).sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR'));

// Mesma reserva de número do Industrial: o número nunca repete, mesmo com dois aparelhos vendendo ao mesmo tempo.
async function reservarNumeroPedido(vdb){
  const snap=await vdb.collection('pedidos').get({source:'server'});
  const maior=snap.docs.reduce((m,d)=>Math.max(m,parseInt(d.data().numero,10)||0),0);
  const ref=vdb.collection('config').doc('geral');
  const tr=vdb.runTransaction(async tx=>{ const s=await tx.get(ref); const dados=s.exists?s.data():{}; let atual=dados.proximoNumeroPedido||1; if(atual<=maior) atual=maior+1; tx.set(ref,{proximoNumeroPedido:atual+1},{merge:true}); return atual; });
  const r=await Promise.race([tr,new Promise(res=>setTimeout(()=>res(null),20000))]);
  if(r===null||r===undefined){ tr.catch(()=>{}); throw new Error('Sem conexão com o servidor para reservar o número do pedido. NADA foi salvo.'); }
  return r;
}

     +'<span class="big">👈</span><b>Escolha um pedido ao lado</b><span>Digite o nome do cliente na busca e toque no pedido.</span>'
     +'<div class="atalhos"><kbd>/</kbd> procurar · <kbd>Enter</kbd> abre o primeiro · <kbd>F2</kbd> venda direta</div></div>';
  }
}
function montarDeskVenda(){
  $('#dkCorpo').innerHTML='<section class="dk-esq"><input id="vBusca" class="dk-busca" type="search" placeholder="🔎 Procurar produto…  ( / )  ·  Enter adiciona o primeiro" autocomplete="off"><div class="dk-abas" id="vAbas"></div><div class="dk-grade" id="vProds"></div></section>'
   +'<aside class="dk-lado"><div class="dk-lado-cab"><span>🛒 Venda atual</span><button class="sair" id="bLimpar">Limpar</button></div><div class="dk-itens" id="vCart"></div>'
   +'<div class="dk-rod"><label style="margin-top:0">Representante (opcional)</label><select id="vRep"></select>'
   +'<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px"><span class="dk-tot-rot">Total da venda</span><span class="dk-tot" id="vTotal">R$ 0,00</span></div>'
   +'<label>Quanto o cliente entregou</label><div class="pre"><b>R$</b><input id="vRec" inputmode="decimal" placeholder="valor certo"></div>'
   +'<div class="chips"><button data-t="1">Valor certo</button><button data-v="20">R$ 20</button><button data-v="50">R$ 50</button><button data-v="100">R$ 100</button></div><div id="vCalc" class="calc"></div>'
   +'<button class="btn ok" id="vOk">✅ Concluir venda  (F9)</button></div></aside>';
  $('#vBusca').oninput=e=>{ buscaProd=e.target.value; listarProds(); };
  $('#vRep').onchange=e=>{ repSel=e.target.value; }; $('#vOk').onclick=concluirVenda; $('#vRec').oninput=atualizarTotalVenda;
  $('#bLimpar').onclick=()=>{ carrinho=[]; desenharCarrinho(); };
  document.querySelectorAll('.dk-rod .chips button').forEach(b=>b.onclick=()=>{ const v=b.dataset.t?totalCarrinho():Number(b.dataset.v); $('#vRec').value=v>0?String(v.toFixed(2)).replace('.',','):''; atualizarTotalVenda(); });
  desenharCarrinho(); deskVendaDados(); $('#vBusca').focus();
}
function deskVendaDados(){
  const g=$('#vProds'); if(!g) return;
  const pronto=()=>{ const sr=$('#vRep'); if(sr) sr.innerHTML='<option value="">— nenhum —</option>'+vkReps.map(r=>'<option value="'+esc(r.id)+'"'+(r.id===repSel?' selected':'')+'>'+esc(r.nome)+'</option>').join('');
    const ab=$('#vAbas'); if(ab){ ab.innerHTML=vkCats.length?'<button class="dk-aba'+(!vkCatSel?' on':'')+'" data-c="">Todos</button>'+vkCats.filter(c=>vkProdutos.some(p=>p.categoriaId===c.id)).map(c=>'<button class="dk-aba'+(vkCatSel===c.id?' on':'')+'" data-c="'+esc(c.id)+'">'+esc(c.nome)+'</button>').join(''):''; ab.querySelectorAll('.dk-aba').forEach(b=>b.onclick=()=>{ vkCatSel=b.dataset.c; pronto(); }); }
    listarProds(); };
  if(vkProdutos.length){ pronto(); return; }
  g.innerHTML='<div class="vazio" style="grid-column:1/-1">⏳ Carregando produtos do Industrial…</div>';
  carregarProdutos().then(pronto).catch(e=>{ g.innerHTML='<div class="vazio" style="grid-column:1/-1">⛔ Não consegui carregar os produtos.</div>'; erro('Não consegui carregar os produtos', /network/i.test(e.code||e.message)?'Sem internet. Tente de novo quando tiver sinal.':(e.message||String(e))); });
}
window.matchMedia('(min-width:980px)').addEventListener('change',()=>{ const A=$('#app'); limparDesk(A); A.innerHTML=''; desenhar(); });

/* ---------- teclado (computador) ---------- */
document.addEventListener('keydown',e=>{
  if(!usuario) return;
  const md=$('#modal');
  if(md.classList.contains('on')){   // aviso aberto: Enter confirma (1º botão), Esc fecha pelo último botão
    const bs=md.querySelectorAll('#mBtns .btn');
    if(e.key==='Enter' && bs.length && !(document.activeElement && document.activeElement.closest('#mBody'))){ e.preventDefault(); bs[0].click(); }
    else if(e.key==='Escape' && bs.length){ e.preventDefault(); bs[bs.length-1].click(); }
    return;
  }
  const ovh=$('#dkOv'); if(ovh&&ovh.classList.contains('on')){ if(e.key==='Escape'){ e.preventDefault(); deskHist(false); } return; }
  const dk=ehDesk(), tela = dk ? (modo==='venda' ? 'venda' : (sel?'receber':'')) : ($('#app').dataset.tela||''), digitando=/^(INPUT|SELECT|TEXTAREA)$/.test((document.activeElement||{}).tagName||'');
  if(e.key==='Escape'){ if(tela==='venda' && !dk){ fecharVenda(); e.preventDefault(); } else if(tela==='receber'){ voltar(); e.preventDefault(); } return; }
  if(e.key==='F9'){ e.preventDefault(); if(tela==='venda') concluirVenda(); else if(tela==='receber') confirmarRecebimento(); return; }
  if(e.key==='F2'){ e.preventDefault(); if(dk) setModo('venda'); else if(!tela) abrirVenda(); return; }
  if(e.key==='F3'){ e.preventDefault(); if(dk) setModo('receber'); return; }
  if(e.key==='/' && !digitando){ const i=$('#fBusca')||$('#vBusca'); if(i){ e.preventDefault(); i.focus(); } return; }
  if(e.key==='Enter' && digitando){
    const id=document.activeElement.id;
    if(id==='rValor'||id==='rData'){ e.preventDefault(); confirmarRecebimento(); }
    else if(id==='vRec'){ e.preventDefault(); concluirVenda(); }
    else if(id==='fBusca' && primeiroId){ e.preventDefault(); abrirReceber(primeiroId); }
    else if(id==='vBusca'){ e.preventDefault(); const b=document.querySelector('#vProds .prod, #vProds tbody tr'); if(b){ addProd(b.dataset.id); document.activeElement.select(); } }
  }
});
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
iniciar();
