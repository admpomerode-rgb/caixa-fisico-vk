<style>
:root{--bg:#F5F7FA;--card:#fff;--tx:#0B0F14;--soft:#5B6472;--bd:#E3E7EE;--ac:#3B6FE0;--ac2:#14315C;--ok:#1E9E6B;--warn:#D98F2B;--bad:#D5473F;--grad:linear-gradient(135deg,#1B2440 0%,#14315C 55%,#1F2E52 100%);--sombra:0 1px 2px rgba(11,15,20,.04),0 10px 28px -14px rgba(20,49,92,.16);--campo:#F5F7FA;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;--disp:'Space Grotesk','Inter',system-ui,sans-serif}
html[data-tema=escuro]{--bg:#0b1220;--card:#121b2e;--tx:#eaf0fb;--soft:#93a3bd;--bd:#223049;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--sombra:0 10px 28px -14px rgba(0,0,0,.7);--campo:#0e1626;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:var(--bg) radial-gradient(circle at 100% 0%,rgba(59,111,224,.06),transparent 45%) fixed}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 60px}
h1{font-family:var(--disp);font-size:24px;margin:0;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--soft);font-size:14px}
.topo{display:flex;align-items:center;gap:12px;margin:4px 2px 14px}
.topo .ic{width:50px;height:50px;border-radius:14px;box-shadow:var(--sombra);overflow:hidden;flex-shrink:0}.topo .ic img{width:100%;height:100%;display:block}
.topo .tx{flex:1;min-width:0}
.sair{background:var(--card);border:1px solid var(--bd);color:var(--ac);border-radius:12px;padding:9px 14px;font-size:14px;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--sombra)}
label{display:block;font-size:12px;color:var(--soft);margin:14px 0 6px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
select,input{width:100%;font-size:20px;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--campo);color:var(--tx);min-height:54px;font-family:inherit}
select:focus,input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px rgba(59,111,224,.15)}
.pre{position:relative} .pre b{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--soft);font-weight:600;pointer-events:none}
.pre input{padding-left:56px;font-size:32px;font-weight:600;min-height:72px;font-family:var(--mono)}
.btn{display:block;width:100%;min-height:58px;font-size:18px;font-weight:600;border-radius:12px;border:0;background:var(--ac);color:#fff;margin-top:14px;cursor:pointer;box-shadow:0 8px 18px -10px rgba(59,111,224,.8)}
.btn:active{transform:scale(.985)} .btn.sec{background:var(--card);color:var(--ac);border:1px solid var(--bd);box-shadow:none} .btn.ruim{background:var(--bad)} .btn:disabled{opacity:.5}
.btn.ok{background:var(--ok);box-shadow:0 8px 18px -10px rgba(30,158,107,.8)}
.total{background:var(--grad);color:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--sombra);position:relative;overflow:hidden}
.total::after{content:'';position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(59,111,224,.25)}
.total .peq{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.75;position:relative;z-index:1} .total b{font-family:var(--mono);font-size:32px;display:block;margin-top:4px;position:relative;z-index:1;font-weight:600}
.total .info{font-size:13px;opacity:.8;position:relative;z-index:1}
.ped{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px;color:var(--tx);cursor:pointer;min-height:76px;box-shadow:var(--sombra)}
.ped:active{transform:scale(.985)} .ped .tx{flex:1;min-width:0} .ped .nm{font-family:var(--disp);font-weight:600;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ped small{display:block;color:var(--soft);font-size:13.5px;margin-top:3px} .ped .vl{font-family:var(--mono);font-weight:600;font-size:19px;text-align:right;white-space:nowrap}
.ped .vl small{font-family:'Inter',system-ui;font-weight:500}
h3.sec{margin:18px 4px 8px;font-family:var(--disp);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px} .chips button{flex:1;min-width:70px;border:1px solid var(--bd);background:var(--campo);color:var(--ac);border-radius:12px;padding:12px 6px;font-size:16px;font-weight:600;cursor:pointer}
.calc{margin-top:12px;font-size:17px;font-weight:600;border-radius:12px;padding:12px 14px;display:none}
.calc.troco,.calc.exato{display:block;color:var(--ok);background:#E6F6EE}.calc.falta{display:block;color:var(--warn);background:#FDF3E5}
.hist{border-top:1px solid var(--bd);padding:10px 0;font-size:15px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.hist:first-of-type{border-top:0} .hist small{display:block;color:var(--soft)}
.tag{font-size:11.5px;font-weight:600;border-radius:99px;padding:4px 10px;white-space:nowrap;display:inline-block}
.t-novo{color:var(--warn);background:#FDF3E5} .t-importado{color:var(--ok);background:#E6F6EE} .t-erro,.t-sem_conta{color:var(--bad);background:#FDEEED}
.off{background:#FDF3E5;color:#7a4a05;border:1px solid var(--warn);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px;font-weight:600}
.alerta{background:#FDEEED;color:#8a1f19;border:2px solid var(--bad);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:600}
.parc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#E8F7F4;border:1px solid #17B8A0;border-radius:10px;padding:9px 11px;margin:0 0 8px;font-size:14px;cursor:pointer;line-height:1.3}.parc input[type=checkbox]{width:20px!important;height:20px!important;min-height:0!important;padding:0!important;margin:0!important;flex:none}.parc small{color:var(--soft);flex-basis:100%}.cart .ent{margin-top:6px;font-size:13px;color:var(--tx);display:flex;align-items:center;gap:6px;flex-wrap:wrap}.cart .ent input{width:72px!important;min-height:36px!important;height:36px;padding:4px 8px!important;font-size:15px!important;border:1px solid var(--bd);border-radius:8px;text-align:right;margin:0!important}.cart .ent .bad{color:#C0392B}.cart{display:flex;align-items:center;gap:10px;border-top:1px solid var(--bd);padding:10px 0}.cart:first-child{border-top:0}.cart .tx{flex:1;min-width:0;font-weight:600}.cart .tx small{display:block;color:var(--soft);font-weight:500}
.qtd{display:flex;align-items:center;gap:6px}.qtd button{width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--campo);color:var(--ac);font-size:22px;font-weight:600}.qtd input{width:64px;min-height:44px;font-size:18px;text-align:center;padding:4px}
.prod{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px;color:var(--tx);font-size:17px;font-weight:600;min-height:56px}.prod small{color:var(--soft);font-weight:500}.prod b{font-family:var(--mono)}
#modal{position:fixed;inset:0;background:rgba(11,15,20,.6);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
#modal.on{display:flex} #modal .box{background:var(--card);border-radius:18px;padding:22px;max-width:440px;width:100%;border-top:8px solid var(--warn);box-shadow:0 24px 60px -20px rgba(0,0,0,.5);max-height:92vh;overflow:auto}
#modal.erro .box{border-top-color:var(--bad)} #modal.ok .box{border-top-color:var(--ok)}
#modal .ico{font-size:34px;line-height:1;margin-bottom:6px} #modal h2{font-family:var(--disp);margin:0 0 8px;font-size:22px} #modal p{font-size:17.5px;line-height:1.45;margin:6px 0 4px;white-space:pre-line}
.vazio{text-align:center;padding:22px 14px;color:var(--soft);font-size:15.5px;line-height:1.5} .vazio .big{font-size:38px;display:block;margin-bottom:6px}
.min{font-size:13px;color:var(--soft);text-align:center;margin-top:18px}

.cols{display:flex;flex-direction:column}.c2a{order:1}.c1{order:2}.c2b{order:3}.vgrid{display:flex;flex-direction:column}.vcart{order:1}.vprods{order:2}
.atalhos{display:none}

body.desk{overflow:hidden}
.wrap.desk{max-width:none;padding:0;height:100vh;display:flex;flex-direction:column}
.dk-top{display:flex;align-items:center;gap:16px;padding:10px 22px;background:var(--card);border-bottom:1px solid var(--bd);flex-shrink:0}
.dk-marca{display:flex;align-items:center;gap:10px}.dk-marca img{width:44px;height:44px;border-radius:12px;box-shadow:var(--sombra)}.dk-marca b{font-family:var(--disp);font-size:18px;display:block;line-height:1.1}.dk-marca small{color:var(--soft);font-size:12px}
.dk-tabs{display:flex;gap:8px;margin-left:10px}.dk-tab{border:1px solid var(--bd);background:var(--campo);color:var(--tx);border-radius:999px;padding:11px 20px;font-weight:600;font-size:15.5px;cursor:pointer}.dk-tab.on{background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 8px 18px -10px rgba(59,111,224,.8)}.dk-tab small{opacity:.7;margin-left:6px;font-weight:500}
.dk-info{display:flex;gap:26px;margin-left:auto;align-items:center;font-size:11.5px;color:var(--soft);text-transform:uppercase;letter-spacing:.05em}.dk-info b{display:block;color:var(--tx);font-size:15px;text-transform:none;letter-spacing:0;font-weight:600}.dk-info .mono{font-family:var(--mono)}
.dk-live{color:var(--ok);font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}.dk-live::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ok)}
/* barra de cima organizada + subtela "Caixa de hoje" */
.dk-top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px;padding:10px 24px;box-shadow:0 1px 0 var(--bd),0 6px 18px -12px rgba(11,15,20,.25)}
.dk-tabs{margin-left:0;justify-self:start;background:var(--campo);border:1px solid var(--bd);border-radius:999px;padding:4px;gap:4px}
.dk-tab{border:0;background:transparent;padding:10px 22px;white-space:nowrap}.dk-tab small{margin-left:8px;opacity:.6;font-weight:500}.dk-tab.on{box-shadow:0 4px 12px -4px rgba(59,111,224,.6)}
.dk-dir{display:flex;align-items:center;gap:10px}
.dk-chip{display:flex;flex-direction:column;justify-content:center;border:1px solid var(--bd);background:var(--campo);border-radius:12px;padding:6px 14px;font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.05em;line-height:1.25;white-space:nowrap}.dk-chip b{font-size:14.5px;color:var(--tx);text-transform:none;letter-spacing:0;font-weight:600}
.dk-btn{position:relative;display:flex;align-items:center;gap:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:0 16px;min-height:46px;font-weight:600;font-size:14.5px;cursor:pointer;font-family:inherit;white-space:nowrap}.dk-btn:hover{border-color:var(--ac);color:var(--ac)}
.dk-bad{display:none;background:var(--bad);color:#fff;border-radius:99px;font-size:12px;padding:1px 8px;margin-left:2px}.dk-bad.on{display:inline-block}
.dk-op{display:flex;align-items:center;gap:10px;padding-left:12px;border-left:1px solid var(--bd);font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.05em;line-height:1.25}.dk-op b{display:block;font-size:14.5px;color:var(--tx);text-transform:none;letter-spacing:0;font-weight:600}
.dk-ov{position:fixed;inset:0;background:rgba(10,18,32,.55);display:none;align-items:center;justify-content:center;z-index:40}.dk-ov.on{display:flex}
.dk-mod{background:var(--card);border:1px solid var(--bd);border-radius:20px;width:min(660px,92vw);max-height:86vh;display:flex;flex-direction:column;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.dk-mod-cab{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--bd);font-family:var(--disp);font-weight:700;font-size:19px}
.dk-mod-cor{padding:18px 22px;overflow:auto}
.dk-vazio{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:50px 30px;color:var(--soft);flex:1}.dk-vazio .big{font-size:52px}.dk-vazio b{color:var(--tx);font-size:18px}
.dk-corpo{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 460px}
.dk-esq{min-width:0;display:flex;flex-direction:column;min-height:0;padding:16px 22px 0}
.dk-busca{font-size:19px;padding:14px 18px;border-radius:14px;min-height:58px;flex-shrink:0}
.dk-abas{display:flex;gap:8px;overflow-x:auto;padding:12px 0 8px;flex-shrink:0}.dk-aba{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14.5px;cursor:pointer}.dk-aba.on{background:var(--ac2);color:#fff;border-color:var(--ac2)}
.dk-grade{flex:1;overflow:auto;padding:8px 0 24px}
.dk-tb{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sombra);font-size:16px}
.dk-tb th{position:sticky;top:0;z-index:1;background:#EEF2F9;color:var(--soft);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;text-align:left;padding:12px 14px;border-bottom:1px solid var(--bd)}
.dk-tb th:first-child{border-top-left-radius:14px}.dk-tb th:last-child{border-top-right-radius:14px}
.dk-tb td{padding:0 14px;height:54px;border-bottom:1px solid var(--bd)}.dk-tb tr:last-child td{border-bottom:0}
.dk-tb tbody tr{cursor:pointer}.dk-tb tbody tr:nth-child(even){background:#FAFBFD}.dk-tb tbody tr:hover{background:#EAF0FD}
.dk-tb tbody tr.alvo{background:#E3ECFD;box-shadow:inset 4px 0 0 var(--ac)}
.dk-tb .nm{font-weight:600}.dk-tb .un,.dk-tb .cat{color:var(--soft);font-size:14px}.dk-tb .pr{font-family:var(--mono);font-weight:600;text-align:right;white-space:nowrap}
.dk-tb .qt{text-align:center;width:90px}.dk-tb .qt b{display:inline-block;min-width:34px;padding:3px 10px;border-radius:99px;background:var(--ok);color:#fff;font-size:14px}
.dk-tb .ad{width:70px;text-align:center}.dk-tb .ad span{display:inline-flex;width:38px;height:38px;border-radius:50%;align-items:center;justify-content:center;background:var(--ac);color:#fff;font-size:22px;font-weight:600}
html[data-tema=escuro] .dk-tb th{background:#16223a}html[data-tema=escuro] .dk-tb tbody tr:nth-child(even){background:#101a2e}html[data-tema=escuro] .dk-tb tbody tr:hover{background:#1b2a47}html[data-tema=escuro] .dk-tb tbody tr.alvo{background:#1d3157}
.dk-prod{display:flex;flex-direction:column;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;padding:0;cursor:pointer;color:var(--tx);box-shadow:var(--sombra)}
.dk-prod:hover{border-color:var(--ac);box-shadow:0 2px 6px rgba(11,15,20,.06),0 16px 36px -14px rgba(20,49,92,.28)}.dk-prod:active{transform:scale(.97)}
.dk-prod .foto{height:78px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:30px;font-weight:700;color:#fff;background:linear-gradient(135deg,#3B6FE0,#14315C)}
.dk-prod .inf{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}.dk-prod .inf b{font-size:14.5px;line-height:1.2;font-weight:600}.dk-prod .inf span{font-family:var(--mono);font-weight:600;font-size:16px;color:var(--ac2)}.dk-prod .inf small{color:var(--soft);font-size:12px}
.dk-scroll{flex:1;overflow:auto;padding:12px 2px 24px}
.dk-lista{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}.dk-lista .ped{margin:0}
.dk-lado{background:var(--card);border-left:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.dk-lado-cab{padding:14px 20px;border-bottom:1px solid var(--bd);font-family:var(--disp);font-weight:600;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.dk-itens{flex:1;overflow:auto;padding:4px 20px;min-height:150px}.dk-itens .parc{padding:6px 10px;margin:4px 0 6px;font-size:13.5px}.dk-itens .parc small{display:none}.dk-rod{max-height:62%}
.dk-rod{padding:14px 20px 18px;border-top:1px solid var(--bd);overflow:auto;max-height:70%}
.dk-rod .pre input{font-size:28px;min-height:62px}.dk-rod .btn{min-height:64px;font-size:19px}
.dk-tot-rot{font-size:12px;color:var(--soft);text-transform:uppercase;letter-spacing:.08em;font-weight:600}.dk-tot{font-family:var(--mono);font-size:40px;font-weight:600;line-height:1.1}
.dk-box{padding:20px;overflow:auto;flex:1}
.dk-box h2{font-family:var(--disp);margin:2px 0 4px;font-size:24px}
.dk-sub{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px}
.atalhos{display:block;text-align:center;color:var(--soft);font-size:12.5px;margin-top:10px}.atalhos kbd{background:var(--campo);border:1px solid var(--bd);border-radius:6px;padding:1px 7px;font-family:var(--mono);font-size:12px}

/* ===== visual tecnológico (computador) ===== */
body.desk{background:linear-gradient(180deg,#edf2fb 0%,#f8faff 100%)}
html[data-tema=escuro] body.desk{background:linear-gradient(180deg,#08101f 0%,#0b1426 100%)}
body.desk::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(59,111,224,.13) 1px,transparent 1px);background-size:26px 26px;mask-image:linear-gradient(180deg,#000 0%,transparent 70%)}
.wrap.desk{position:relative}
.dk-top{background:linear-gradient(110deg,#0a1b38 0%,#13305b 58%,#0e4a6b 100%);border-bottom:0;padding:9px 18px;gap:14px;box-shadow:0 10px 30px -12px rgba(10,27,56,.7);color:#fff;position:relative}
.dk-top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,#22e3c0,#3b8bff,transparent);opacity:.9}
.dk-marca{gap:10px;white-space:nowrap}.dk-marca img{width:40px;height:40px;box-shadow:0 0 0 2px rgba(255,255,255,.15),0 6px 18px -4px rgba(34,227,192,.5)}
.dk-marca b{color:#fff;font-size:19px;letter-spacing:.01em}.dk-marca small{display:none;color:#9fb6d6}
@media (min-width:1440px){.dk-marca small{display:block}}
.dk-tabs{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);padding:4px;gap:4px;backdrop-filter:blur(6px)}
.dk-tab{color:#cfe0f7;white-space:nowrap;padding:9px 18px;font-size:15px;border-radius:999px}.dk-tab small{display:inline}
@media (max-width:1339px){.dk-tab small{display:none}}
.dk-tab.on{color:#04221d;background:linear-gradient(135deg,#2ee6c5,#4aa8ff);box-shadow:0 0 18px -2px rgba(46,230,197,.65)}
.dk-dir{gap:8px;justify-self:end;white-space:nowrap}
.dk-chip{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#9fb6d6;padding:5px 12px}.dk-chip b{color:#fff;font-size:14px}
.dk-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;min-height:42px;padding:0 14px;font-size:14px}.dk-btn:hover{background:rgba(255,255,255,.16);border-color:#2ee6c5;color:#fff}
.dk-btn .tx2{display:none}@media (min-width:1500px){.dk-btn .tx2{display:inline}}
.dk-btn .tx{display:inline}@media (max-width:1339px){.dk-btn .tx{display:none}}
.dk-live{color:#2ee6c5!important;font-size:12.5px}.dk-live::before{background:#2ee6c5;box-shadow:0 0 10px #2ee6c5}
.dk-op{border-left:1px solid rgba(255,255,255,.18);color:#9fb6d6}.dk-op b{color:#fff;font-size:14px}
.dk-top .sair{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff;padding:8px 12px}
.dk-corpo{grid-template-columns:minmax(0,1fr) 420px;gap:0}
.dk-esq{padding:18px 22px 0}
/* busca com botão Pesquisar */
.dk-pesq{display:flex;gap:10px;align-items:center;background:var(--card);border:1.5px solid var(--bd);border-radius:18px;padding:7px 8px 7px 18px;box-shadow:0 14px 34px -18px rgba(20,49,92,.45);transition:.15s;flex-shrink:0}
.dk-pesq:focus-within{border-color:#2f7bff;box-shadow:0 0 0 4px rgba(47,123,255,.15),0 14px 34px -18px rgba(20,49,92,.5)}
.dk-pesq .lupa{font-size:22px}.dk-pesq input{border:0!important;box-shadow:none!important;background:transparent!important;font-size:19px;min-height:48px;padding:0 6px;flex:1}
.dk-go{border:0;border-radius:13px;padding:0 28px;min-height:48px;font-weight:700;font-size:16px;color:#04221d;background:linear-gradient(135deg,#2ee6c5,#4aa8ff);cursor:pointer;box-shadow:0 8px 20px -8px rgba(46,230,197,.8)}.dk-go:active{transform:scale(.97)}
.dk-lista .ped{border-radius:16px;transition:.15s}.dk-lista .ped:hover{border-color:#2f7bff;box-shadow:0 0 0 3px rgba(47,123,255,.12),0 16px 30px -16px rgba(20,49,92,.5);transform:translateY(-1px)}
/* painel da direita sem barra de rolagem */
.dk-lado{border-left:0;margin:14px 18px 16px 0;border-radius:22px;border:1px solid var(--bd);overflow:hidden;box-shadow:0 22px 50px -26px rgba(20,49,92,.55);position:relative}
.dk-lado::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#2ee6c5,#4aa8ff)}
.dk-lado-cab{padding:12px 18px;font-size:16px}
.dk-box{padding:12px 18px 16px;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.dk-box h2{font-size:21px;margin:0}.dk-box .sub{font-size:13px}
.dk-box label{margin:8px 0 4px;font-size:12px}
.dk-box .dk-sub{margin-top:8px}.dk-box .dk-tot{font-size:38px;background:linear-gradient(135deg,#0f9d86,#2f7bff);-webkit-background-clip:text;background-clip:text;color:transparent}
html[data-tema=escuro] .dk-box .dk-tot{background:linear-gradient(135deg,#2ee6c5,#6cb6ff);-webkit-background-clip:text;background-clip:text}
.dk-box .pre input{font-size:26px;min-height:52px}.dk-box .chips{margin-top:6px}.dk-box .chips button{padding:9px 4px;font-size:14.5px;min-width:60px}
.dk-box .calc{margin-top:6px;padding:8px 12px;font-size:15px}
.dk-box input[type=date]{min-height:44px;font-size:16px}
.dk-box .btn,.dk-rod .btn{min-height:54px;font-size:18px;margin-top:10px;background:linear-gradient(135deg,#17c9a4,#2f7bff);border:0;color:#fff;box-shadow:0 12px 26px -12px rgba(47,123,255,.8)}
.dk-vazio{padding:24px 24px}
.dk-itens{padding:2px 16px}
.dk-rod{padding:10px 18px 14px;overflow:hidden;max-height:none}.dk-rod label{margin:6px 0 3px;font-size:12px}
.dk-rod .pre input{font-size:24px;min-height:50px}.dk-rod select{min-height:44px}.dk-rod .dk-tot{font-size:32px}.dk-rod .chips{margin-top:6px}.dk-rod .chips button{padding:8px 4px;font-size:14px;min-width:56px}.dk-rod .calc{margin-top:6px;padding:7px 12px;font-size:15px}
@media (max-height:760px){.dk-box .dk-tot{font-size:32px}.dk-box .pre input{min-height:46px;font-size:23px}.dk-box .btn,.dk-rod .btn{min-height:48px;font-size:17px}.dk-rod .pre input{min-height:44px}.dk-rod select{min-height:38px}}

/* ===== Pix ===== */
.pixov{position:fixed;inset:0;z-index:80;background:rgba(8,16,32,.72);display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}
.pixcard{background:#fff;color:#0B0F14;border-radius:22px;width:min(440px,100%);padding:16px 20px 18px;box-shadow:0 30px 80px -20px rgba(0,0,0,.7);text-align:center;max-height:98vh;overflow:auto}
.pixcard .pt{font-weight:800;font-size:17px;color:#14315C}.pixcard .pv{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:34px;margin:2px 0}
.pixcard .ps{color:#5B6472;font-size:14px}
.pixcard .pq{margin:10px auto;width:min(300px,42vh,100%);background:#fff;border:1px solid #E3E7EE;border-radius:16px;padding:6px}.pixcard .pq svg{display:block;width:100%;height:auto}
.pixcard .pm{font-size:14px;color:#33415C;margin:4px 0 8px}
.pixcard .pc{display:flex;gap:8px;margin:6px 0}.pixcard .pc input{flex:1;min-width:0;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;padding:10px;border:1px solid #E3E7EE;border-radius:10px;background:#F5F7FA;color:#0B0F14}
.pixcard .pc button{border:1px solid #3B6FE0;background:#fff;color:#3B6FE0;border-radius:10px;padding:0 14px;font-weight:700;cursor:pointer}
.pixcard .pa{background:#FFF7E6;border:2px solid #D98F2B;color:#7A4B00;border-radius:12px;padding:9px 12px;font-size:14px;font-weight:700;margin:8px 0}
.pixcard .btn{margin-top:8px;min-height:54px}.px2{display:grid;grid-template-columns:1.5fr 1fr;gap:8px}
@media (max-height:760px){.pixcard .pm{display:none}.pixcard .pq{width:min(250px,34vh)}.pixcard .pv{font-size:30px}.pixcard{padding:12px 18px 14px}}
.dk-2b{display:grid;grid-template-columns:1.25fr 1fr;gap:8px}.dk-2b .btn{margin-top:10px}
.btn.pix{background:linear-gradient(135deg,#0fb5a6,#1e88e5);color:#fff;border:0}

/* ===== cliente na venda direta ===== */
.cli-busca{display:flex;gap:6px;align-items:center}.cli-busca input{flex:1;min-width:0;min-height:42px;font-size:15px;padding:8px 12px}.cli-busca .sair{padding:9px 11px;white-space:nowrap}
.cli-sel{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;background:linear-gradient(135deg,rgba(46,230,197,.12),rgba(74,168,255,.12));border:1px solid rgba(47,123,255,.35);border-radius:12px;padding:8px 10px}
.cli-sel b{font-size:15px}.cli-sel small{display:block;color:var(--soft);font-size:12.5px;line-height:1.35}.cli-sel .ok{color:var(--ok);font-weight:700}.cli-sel .bad{color:var(--bad);font-weight:800}
.dk-cli{padding:8px 16px;border-bottom:1px solid var(--bd)}
.dk-lado .cli-sel small{font-size:12px}
.vdesc .bad,.cli-sel a{color:var(--bad);font-weight:700}.vdesc{font-size:13px;color:var(--soft);text-align:left;margin:-2px 0 2px}.vdesc b{color:var(--ok)}

.dk-abas{flex-wrap:wrap;overflow:visible}.dk-aba.g{background:var(--gc);color:#fff;border-color:transparent;opacity:.62}.dk-aba.g.on{opacity:1;box-shadow:0 0 0 3px rgba(255,255,255,.9),0 0 0 5px var(--gc)}
.dk-grade{scrollbar-width:none}.dk-grade::-webkit-scrollbar{display:none}
.dk-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.dk-tile{position:relative;text-align:left;background:var(--card);border:1px solid var(--bd);border-top:5px solid var(--gc,#3B6FE0);border-radius:14px;padding:10px 12px;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;cursor:pointer;color:var(--tx);box-shadow:var(--sombra);font-family:inherit}
.dk-tile:hover{transform:translateY(-1px);border-color:var(--gc)}.dk-tile.alvo{outline:3px solid var(--ac)}
.dk-tile .nm{font-size:15px;line-height:1.2;padding-right:30px}.dk-tile .pr{font-family:var(--mono);font-weight:700;font-size:16px;color:var(--ac2)}.dk-tile .pr small{font-weight:500;color:var(--soft);font-size:11px}
.dk-tile .qb{position:absolute;right:8px;top:8px;min-width:26px;text-align:center;border-radius:99px;background:var(--ok);color:#fff;font-weight:800;font-size:13px;padding:2px 8px}.dk-tile .qb:empty{display:none}
html[data-tema=escuro] .dk-tile .pr{color:#8FB6FF}
.org-esq{width:250px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;overflow:auto}.org-dir{flex:1;min-width:0;overflow:auto;padding-right:6px}#orgCorpo{display:flex;gap:16px}
.og{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--bd);border-left:6px solid var(--gc);border-radius:10px;padding:7px 8px;cursor:pointer;background:var(--card)}.og.on{background:#E3ECFD;border-color:var(--gc)}html[data-tema=escuro] .og.on{background:#1d3157}.og-n small{color:var(--soft)}
.og-b button,.op button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:7px;width:26px;height:26px;cursor:pointer;margin-left:3px}
.org-cores{display:flex;gap:8px;margin:4px 0}.org-cores button{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer}.org-cores button.on{border-color:var(--tx)}
.org-sel{border:1px solid var(--bd);border-radius:10px;max-height:112px;overflow:auto}.op{display:flex;justify-content:space-between;align-items:center;padding:3px 9px;border-bottom:1px solid var(--bd);font-size:14px}.op:last-child{border-bottom:0}
.org-add{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;max-height:96px;overflow:auto}.org-add button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 11px;font-size:13px;cursor:pointer}
</style>
</head>

<script>
/* Caixa VK — frente de caixa rápida. Grava cada dinheiro recebido em "caixa_app_recebimentos" (mesmo Firebase do Livro Caixa);
   o Livro Caixa importa sozinho (conta Caixa físico, pedido baixado, VK Industrial avisado). Lê "caixa_app_pedidos" e "caixa_app_config". */
const CONFIG = { apiKey:"AIzaSyBbSv3c_UKvhi3Qm0V0Nw3n4bU-sCKaarE", authDomain:"financeiro-livro-caixa.firebaseapp.com", projectId:"financeiro-livro-caixa", storageBucket:"financeiro-livro-caixa.firebasestorage.app", messagingSenderId:"515159506710", appId:"1:515159506710:web:c41985f0febd4a717b5a37" };
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n=>'R$ '+(Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const num = s=>{ if(typeof s==='number') return s; s=String(s==null?'':s).trim().replace(/\s/g,''); if(!s) return 0; if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const n=Number(s); return Number.isFinite(n)?n:NaN; };
const hoje = ()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const dataBR = iso=>iso?String(iso).slice(0,10).split('-').reverse().join('/'):'';
const r2 = x=>Math.round((x+Number.EPSILON)*100)/100;
const norm = s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const uuid = ()=> (crypto.randomUUID ? crypto.randomUUID() : 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,10));

let modo=(function(){try{return localStorage.getItem('caixa_modo')||'receber'}catch(e){return 'receber'}})(), vkCats=[], vkCatSel='', primeiroId='', vkReps=[], repSel='', vkProdutos=[], carrinho=[], buscaProd='', auth, db, usuario=null, pedidos=[], meus=[], conf=null, vkLista=[], vkHora='', vkBuscando=false, busca='', offline=!navigator.onLine, unsubs=[], vkApp=null;

function aviso({titulo,texto,tipo,botoes,corpo}){
  return new Promise(res=>{
    const m=$('#modal'); m.className='on '+(tipo||''); $('#mIco').textContent=({erro:'⛔',ok:'✅'}[tipo]||'⚠️'); $('#mTit').textContent=titulo||''; $('#mTxt').textContent=texto||''; $('#mBody').innerHTML=corpo||'';
    const b=$('#mBtns'); b.innerHTML='';
    (botoes||[{t:'OK',v:true}]).forEach(x=>{ const e=document.createElement('button'); e.className='btn '+(x.cls||''); e.textContent=x.t; e.onclick=()=>{ const v=typeof x.v==='function'?x.v():x.v; if(v===undefined) return; m.className=''; $('#mBody').innerHTML=''; res(v); }; b.appendChild(e); });
  });
}
const erro = (t,x)=>aviso({titulo:t,texto:x,tipo:'erro'});
const confirmar = (t,x,ok='Sim, confirmar',nao='Voltar')=>aviso({titulo:t,texto:x,botoes:[{t:ok,v:true},{t:nao,v:false,cls:'sec'}]});

function iniciar(){
  if(typeof firebase==='undefined'){ $('#app').innerHTML='<div class="card"><h1>Sem internet</h1><p>Abra o app uma vez com internet para carregar.</p></div>'; return; }
  firebase.initializeApp(CONFIG); auth=firebase.auth(); db=firebase.firestore();
  db.settings({ experimentalAutoDetectLongPolling:true, cacheSizeBytes:firebase.firestore.CACHE_SIZE_UNLIMITED });
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  window.addEventListener('online',()=>{ offline=false; desenhar(); }); window.addEventListener('offline',()=>{ offline=true; desenhar(); });
  auth.onAuthStateChanged(u=>{ usuario=u; unsubs.forEach(f=>f()); unsubs=[]; if(u) assinar(); else { pedidos=[]; meus=[]; conf=null; vkLista=[]; } desenhar(); });
}
function assinar(){
  const falha = e=>console.error(e);
  unsubs.push(db.collection('caixa_app_pedidos').onSnapshot(s=>{ pedidos=s.docs.map(d=>({id:d.id,...d.data()})); desenhar(); },falha));
  unsubs.push(db.collection('caixa_app_config').doc('geral').onSnapshot(s=>{ conf=s.exists?s.data():null;
    /* guarda o último acesso ao Industrial que funcionou; se o Livro Caixa publicar vazio por engano, o app continua funcionando */
    try{ if(conf&&conf.vk&&conf.vk.firebaseConfig) localStorage.setItem('caixa_vkcfg',JSON.stringify(conf.vk)); else if(conf){ const g=JSON.parse(localStorage.getItem('caixa_vkcfg')||'null'); if(g) conf=Object.assign({},conf,{vk:g}); } }catch(e){}
    desenhar(); },falha));
  unsubs.push(db.collection('caixa_app_recebimentos').where('uid','==',usuario.uid).onSnapshot(s=>{ meus=s.docs.map(d=>({id:d.id,pendente:d.metadata.hasPendingWrites,...d.data()})).sort((a,b)=>String(b.criadoEm||'').localeCompare(String(a.criadoEm||''))); desenhar(); },falha));
}
async function entrar(){
  const e=$('#lEmail').value.trim(), s=$('#lSenha').value; if(!e||!s){ await erro('Faltou algo','Digite o e-mail e a senha.'); return; }
  const b=$('#bEntrar'); b.disabled=true; b.textContent='Entrando…';
  try{ await auth.signInWithEmailAndPassword(e,s); }catch(x){ b.disabled=false; b.textContent='Entrar'; await erro('Não consegui entrar', /network/i.test(x.code||x.message)?'Sem internet. Tente de novo quando tiver sinal.':'E-mail ou senha incorretos.'); }
}
function sair(){ confirmar('Sair da conta?','Você vai precisar entrar de novo.','Sair','Ficar').then(ok=>{ if(ok) auth.signOut(); }); }

/* quanto já foi recebido aqui no app e ainda não apareceu no Livro Caixa */
const chavePed = p=>p.vkPedidoId||p.refId||p.id;
function jaNoApp(p, incluirImportados){ return r2(meus.filter(m=>(m.vkPedidoId||m.refId)===chavePed(p) && (m.status==='novo'||m.status==='sem_conta'||(incluirImportados&&m.status==='importado'))).reduce((s,m)=>s+(Number(m.valor)||0),0)); }
function restanteDe(p){ return r2((Number(p.restante)||0) - jaNoApp(p, p.origemVK)); }

async function vkDb(){
  /* o acesso ao Industrial chega do Firestore alguns instantes depois do login: espera um pouco e, se precisar, usa a cópia guardada neste computador */
  const guardado=()=>{ try{ const g=JSON.parse(localStorage.getItem('caixa_vkcfg')||'null'); return g&&g.firebaseConfig&&g.email&&g.senha?g:null; }catch(e){ return null; } };
  if(!conf || !conf.vk){ const g=guardado(); if(g) conf=Object.assign({},conf||{},{vk:g}); }
  for(let i=0; i<60 && (!conf || !conf.vk); i++) await new Promise(r=>setTimeout(r,200));
  if(!conf) throw new Error('Não consegui ler a configuração do Livro Caixa. Confira a internet e tente de novo.');
  if(!conf.vk) throw new Error('O acesso ao Industrial ainda não foi publicado. Abra o Livro Caixa uma vez e tente de novo.');
  if(!vkApp) vkApp = firebase.initializeApp(conf.vk.firebaseConfig,'vk-industrial');
  const a = vkApp.auth(); if(!a.currentUser) await a.signInWithEmailAndPassword(conf.vk.email, conf.vk.senha);
  return vkApp.firestore();
}
/* ---------- pedidos direto do Industrial (quando o cliente ainda não está no financeiro) ---------- */
async function buscarIndustrial(){
  if(vkBuscando) return;
  if(!conf || !conf.vk){ await erro('Industrial não configurado','Abra o Livro Caixa uma vez (ele publica o acesso ao VK Industrial) e tente de novo.\nSe o problema continuar, confira se a Integração VK Industrial está configurada lá.'); return; }
  vkBuscando=true; desenhar();
  try{
    const vdb = await vkDb();
    const [ps, cs] = await Promise.all([ vdb.collection('pedidos').get({source:'server'}), vdb.collection('clientes').get({source:'server'}) ]);
    const clientes = {}; cs.docs.forEach(d=>clientes[d.id]=d.data());
    const conhecidos = new Set(pedidos.map(p=>p.vkPedidoId).filter(Boolean));
    vkLista = ps.docs.map(d=>({id:d.id,...d.data()})).filter(p=>{
      const f=p.financeiro||{};
      if(p.status==='cancelado'||p.bonificacao||p.isBonificacao||p.pdv||conhecidos.has(p.id)) return false;
      if(p.pagamentoDinheiro||p.pagamentoPix||p.pagamentoCartao||p.pagamentoBoleto||f.status==='pago') return false;
      if(p.vendaDireta && p.pagamentoRealizado) return false;
      return Number(p.valorTotal)>0 && String(p.numero==null?'':p.numero).trim()!=='';
    }).map(p=>{
      const f=p.financeiro||{}, cli=(clientes[p.clienteId]||{}).nome || p.clienteNome || (p.vendaDireta?'Venda Direta':'(sem cliente)');
      const total=Number(p.valorTotal)||0, pago=Math.min(total,Number(f.valorPago)||0);
      return { id:'vk_'+p.id, kind:'vk', origemVK:true, refId:'', vkPedidoId:p.id, cliente:cli, numero:String(p.numero), descricao:'Pedido N° '+p.numero+' — '+cli, valor:total, recebido:pago, restante:r2(total-pago), vencimento:f.vencimento||p.dataEntrega||'', emissao:String(p.data||p.dataPedido||p.criadoEm||'').slice(0,10), _ord:String(p.dataEntrega||p.data||'') };
    }).sort((a,b)=>b._ord.localeCompare(a._ord));
    const d=new Date(); vkHora=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    vkBuscando=false; desenhar();
    if(!vkLista.length) await aviso({titulo:'Nenhum pedido novo',texto:'Não achei no Industrial nenhum pedido em aberto que já não esteja na lista do financeiro.',tipo:'ok'});
  }catch(e){ vkBuscando=false; desenhar(); await erro('Não consegui buscar no Industrial', /network/i.test(e.code||e.message)?'Sem internet. Tente de novo quando tiver sinal.':'Motivo: '+(e.message||e)); }
}

/* ---------- receber ---------- */
let sel=null, salvando=false;
function abrirReceber(id){
  sel = pedidos.concat(vkLista).find(p=>p.id===id); if(!sel) return;
  const rest = restanteDe(sel); if(!(rest>0.009)){ erro('Já recebido','Esse pedido não tem mais valor a receber aqui.'); sel=null; return; }
  $('#app').dataset.tela='receber'; desenhar();
  setTimeout(()=>{ const i=$('#rValor'); if(i){ i.focus(); i.select(); } },50);

/* devolve '' se a chave está certa; senão a explicação em português simples */
function pixValidaChave(k){
  k=String(k==null?'':k);
  if(!k.trim()) return 'A chave Pix está vazia.';
  if(k!==k.trim()||/\s/.test(k)) return 'A chave Pix tem espaço sobrando.';
  if(!/^[\x21-\x7E]+$/.test(k)) return 'A chave Pix tem letra com acento ou símbolo que não existe em chave Pix.';
  if(/^\d{11}$/.test(k)) return pixCpfOk(k)?'':'O CPF da chave Pix não é válido (confira os números).';
  if(/^\d{14}$/.test(k)) return pixCnpjOk(k)?'':'O CNPJ da chave Pix não é válido (confira os números).';
  if(/^\+55\d{10,11}$/.test(k)) return '';
  if(/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/.test(k)) return '';

function pixPayload(o){
  const erroChave=pixValidaChave(o.chave); if(erroChave) throw new Error(erroChave);
  const nome=pixLimpa(o.nome,25), cidade=pixLimpa(o.cidade,15);

  const v=Number(o.valor); if(!(v>0)||!isFinite(v)||v>9999999999.99) throw new Error('O valor do Pix é inválido.');

  let p=pixTLV('00','01')+pixTLV('01','11')+pixTLV('26',mai)+pixTLV('52','0000')+pixTLV('53','986')+pixTLV('54',r2(v).toFixed(2))+pixTLV('58','BR')+pixTLV('59',nome)+pixTLV('60',cidade)+pixTLV('62',pixTLV('05','***'));

/* lê o código campo a campo (em bytes). Erro → lança texto */
function pixLer(s){

  while(i<b.length){

    const id=String.fromCharCode(b[i],b[i+1]), ls=String.fromCharCode(b[i+2],b[i+3]);

    const n=+ls; if(i+4+n>b.length) throw new Error('tamanho do campo '+id+' passa do fim');
    out.push({id,n,v:dec.decode(b.slice(i+4,i+4+n))}); i+=4+n;

    if(ids.join()!==ordem.join()) return 'A estrutura do código Pix está fora de ordem ou incompleta.';
    const ult=c[c.length-1]; if(ult.n!==4||!/^[0-9A-F]{4}$/.test(ult.v)) return 'O final (CRC) do código Pix está errado.';

    if(!/^\d+\.\d{2}$/.test(get('54'))||get('54')!==r2(esp.valor).toFixed(2)) return 'O valor dentro do código Pix não é o valor da venda.';

    if(get('59')!==pixLimpa(esp.nome,25)||get('60')!==pixLimpa(esp.cidade,15)) return 'Nome ou cidade dentro do código Pix não conferem.';

function tabelaDe(c){ return c && c.tabelaPrecoId ? (vkTabelas.find(t=>t.id===c.tabelaPrecoId)||null) : null; }
function baseDe(prod){ const t=tabelaDe(cliSel), v=t&&t.precos?parseFloat(t.precos[prod.id]):0; return v>0?v:(Number(prod.valorPadrao)||0); }
function promoDe(prod){   // mesma regra do Industrial: no ar hoje, e só vale se for mais barata que o preço que o cliente já paga
  const h=hoje(), base=baseDe(prod);

}
function precoDe(prod){ const pr=promoDe(prod); return pr?Number(pr.precoPromocional):baseDe(prod); }
function fotoPromo(prod){ const pr=promoDe(prod); return pr?{id:pr.id,rotulo:pr.rotulo||'',precoOriginal:baseDe(prod),precoPromocional:Number(pr.precoPromocional)}:null; }

  const r=c&&c.descontoCliente; if(!r||!r.id||r.encerradoEm) return null; const h=hoje();
  if(r.tipo==='periodo'){ if(r.inicio&&h<r.inicio) return null; if(r.fim&&h>r.fim) return null; }
  if(r.tipo==='usos' && cliUsos>=(Number(r.usosMax)||0)) return null;
  return (Number(r.percentual)>0)?r:null;
}
function descResumo(r){ if(r.tipo==='periodo') return 'de '+(r.inicio?dataBR(r.inicio):'hoje')+' até '+(r.fim?dataBR(r.fim):'sem data final'); if(r.tipo==='usos') return 'pedido '+(cliUsos+1)+' de '+r.usosMax; return 'fixo, sem data final'; }

  const subA=r2(carrinho.reduce((s,i)=>s+entAgora(i)*i.valorUnitario,0)), baseA=r2(carrinho.reduce((s,i)=>s+(i.promocao?0:entAgora(i)*i.valorUnitario),0)), descA=r2(baseA*pct/100);

// Mesma reserva de número do Industrial: o número nunca repete, mesmo com dois aparelhos vendendo ao mesmo tempo.
async function reservarNumeroPedido(vdb){
  const snap=await vdb.collection('pedidos').get({source:'server'});
  const maior=snap.docs.reduce((m,d)=>Math.max(m,parseInt(d.data().numero,10)||0),0);
  const ref=vdb.collection('config').doc('geral');
  const tr=vdb.runTransaction(async tx=>{ const s=await tx.get(ref); const dados=s.exists?s.data():{}; let atual=dados.proximoNumeroPedido||1; if(atual<=maior) atual=maior+1; tx.set(ref,{proximoNumeroPedido:atual+1},{merge:true}); return atual; });
  const r=await Promise.race([tr,new Promise(res=>setTimeout(()=>res(null),20000))]);
  if(r===null||r===undefined){ tr.catch(()=>{}); throw new Error('Sem conexão com o servidor para reservar o número do pedido. NADA foi salvo.'); }
  return r;
}

  const lim=orgD.filter(g=>(g.nome||'').trim()).map(g=>({id:g.id,nome:g.nome.trim(),cor:g.cor||'#3B6FE0',produtos:g.produtos}));
  vendaCfg=lim.length?{grupos:lim}:null; grpSel='';
  try{ if(vendaCfg) localStorage.setItem('caixa_vendacfg',JSON.stringify(vendaCfg)); else localStorage.removeItem('caixa_vendacfg'); }catch(e){}
  orgFechar(); deskVendaDados();
  let ok=true; try{ await db.collection('caixa_app_config').doc('vendaTela').set({grupos:lim,atualizadoEm:new Date().toISOString(),por:(usuario&&usuario.email)||''}); }catch(e){ ok=false; console.error('salvar vendaTela',e); }
  if(!ok) await aviso({titulo:'Salvo só neste computador',texto:'A organização dos produtos foi salva aqui, mas não consegui enviar para os outros computadores (sem permissão ou sem internet). Neste computador já está valendo.',botoes:[{t:'Entendi',v:true}]});
}
function listarProds(){

  if(dk){
    const gs=gruposAtuais(), cur=grpAtual(gs), g0=gs.find(g=>g.id===cur);
    let ld; if(q) ld=vkProdutos.filter(p=>norm(p.nome).includes(q)).slice(0,300); else if(g0) ld=g0.produtos.map(id=>vkProdutos.find(p=>p.id===id)).filter(Boolean); else ld=vkProdutos.slice(0,400);
    const corDe=p=>{ if(g0&&!q) return g0.cor; const g=gs.find(x=>x.produtos.includes(p.id)); return g?g.cor:'#8A94A6'; };
    w.innerHTML=ld.length? '<div class="dk-tiles">'+ld.map((p,ix)=>{ const c=carrinho.find(i=>i.produtoId===p.id), pr=promoDe(p); return '<button class="dk-tile'+(ix===0&&buscaProd?' alvo':'')+'" data-id="'+esc(p.id)+'" style="--gc:'+corDe(p)+'"><span class="qb">'+(c?String(c.quantidade).replace('.',','):'')+'</span><b class="nm">'+esc(p.nome)+'</b><span class="pr">'+(pr?'🔥 ':'')+brl(precoDe(p))+'<small> /'+esc(p.unidade||'un')+'</small></span></button>'; }).join('')+'</div>'
      : '<div class="vazio">'+(q?'Nenhum produto com esse nome.':'Nenhum produto neste grupo. Use ⚙️ Configurar → Organizar produtos.')+'</div>';

let diasMax=(function(){ try{ const n=Number(localStorage.getItem('caixa_dias')); return n>=1&&n<=365?Math.round(n):25; }catch(e){ return 25; } })();
function dataLimite(){ const d=new Date(); d.setDate(d.getDate()-diasMax); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
/* PRIVACIDADE: só devolve os pedidos de UM cliente (nome completo igual, ou um único cliente que contenha o texto). Nunca mostra nomes parecidos. */
function deskAchar(raw){
  const q=norm(String(raw||'').trim()), lim=dataLimite();
  const todos=pedidos.filter(p=>restanteDe(p)>0.009).concat(vkLista.filter(p=>restanteDe(p)>0.009 && !pedidos.some(x=>x.vkPedidoId&&x.vkPedidoId===p.vkPedidoId)))
    .filter(p=>{ const e=String(p.emissao||''); return !e || e>=lim; });
  const ord=l=>l.sort((x,y)=>String(y.emissao||y.vencimento||'').localeCompare(String(x.emissao||x.vencimento||'')));
  if(/^\d+$/.test(q)){ const r=todos.filter(p=>String(p.numero).trim()===q); return {tipo:r.length?'ok':'nenhum',itens:ord(r)}; }
  const mapa={}; todos.forEach(p=>{ const n=norm(p.cliente); (mapa[n]=mapa[n]||[]).push(p); });
  const nomes=Object.keys(mapa); let ach=nomes.filter(n=>n===q); if(!ach.length) ach=nomes.filter(n=>n.includes(q));
  if(ach.length===1) return {tipo:'ok',itens:ord(mapa[ach[0]].slice())};
  return {tipo:ach.length?'varios':'nenhum',itens:[]};
}

    return;
  }
  const r=deskAchar(buscaDesk), lista=r.itens.slice(0,12);

  if(r.tipo==='ok') corpo='<div class="dk-lista">'+lista.map(cardPed).join('')+'</div>';

  else corpo='<div class="vazio"><span class="big">🔎</span>Nenhum pedido a receber desse cliente nos últimos '+diasMax+' dias.<br><small>Se o pedido é mais antigo, aumente os dias em ⚙️ Configurar.</small></div>';
  w.innerHTML=corpo
   +'<div style="max-width:480px;margin:10px 0"><button class="btn sec" id="bVk" '+(vkBuscando?'disabled':'')+'>'+(vkBuscando?'⏳ Buscando no Industrial…':'🔄 Não achou? Buscar no Industrial')+'</button>'+(vkHora?'<div class="min" style="text-align:left;margin-top:6px">Industrial consultado às '+vkHora+'.</div>':'')+'</div>';

    const ab=$('#vAbas'); if(ab){ const gs=gruposAtuais(), cur=grpAtual(gs); ab.innerHTML=gs.map(g=>'<button class="dk-aba g'+(cur===g.id?' on':'')+'" style="--gc:'+g.cor+'" data-c="'+esc(g.id)+'">'+esc(g.nome)+'</button>').join('')+'<button class="dk-aba'+(cur==='*'?' on':'')+'" data-c="*">Todos</button>'; ab.querySelectorAll('.dk-aba').forEach(b=>b.onclick=()=>{ grpSel=b.dataset.c; pronto(); }); }
    listarProds(); };
  if(vkProdutos.length){ pronto(); return; }
  g.innerHTML='<div class="vazio" style="grid-column:1/-1">⏳ Carregando produtos do Industrial…</div>';
  carregarProdutos().then(pronto).catch(e=>{ g.innerHTML='<div class="vazio" style="grid-column:1/-1">⛔ Não consegui carregar os produtos.</div>'; erro('Não consegui carregar os produtos', /network/i.test(e.code||e.message)?'Sem internet. Tente de novo quando tiver sinal.':(e.message||String(e))); });
}
window.matchMedia('(min-width:980px)').addEventListener('change',()=>{ const A=$('#app'); limparDesk(A); A.innerHTML=''; desenhar(); });

/* ---------- teclado (computador) ---------- */
document.addEventListener('keydown',e=>{
  if(!usuario) return;
  if(document.getElementById('pixOv')) return;
  const md=$('#modal');
  if(md.classList.contains('on')){   // aviso aberto: Enter confirma (1º botão), Esc fecha pelo último botão
    const bs=md.querySelectorAll('#mBtns .btn');
    if(e.key==='Enter' && bs.length && !(document.activeElement && document.activeElement.closest('#mBody'))){ e.preventDefault(); bs[0].click(); }
    else if(e.key==='Escape' && bs.length){ e.preventDefault(); bs[bs.length-1].click(); }
    return;
  }
  const ovo=$('#dkOrg'); if(ovo&&ovo.classList.contains('on')){ if(e.key==='Escape'&&!$('#modal').classList.contains('on')){ e.preventDefault(); orgFechar(); } return; }
  const ovc=$('#dkCfg'); if(ovc&&ovc.classList.contains('on')){ if(e.key==='Escape'){ e.preventDefault(); deskCfg(false); } else if(e.key==='Enter'){ e.preventDefault(); salvarCfg(); } return; }
  const ovh=$('#dkOv'); if(ovh&&ovh.classList.contains('on')){ if(e.key==='Escape'){ e.preventDefault(); deskHist(false); } return; }
  const dk=ehDesk(), tela = dk ? (modo==='venda' ? 'venda' : (sel?'receber':'')) : ($('#app').dataset.tela||''), digitando=/^(INPUT|SELECT|TEXTAREA)$/.test((document.activeElement||{}).tagName||'');
  if(e.key==='Escape'){ if(tela==='venda' && !dk){ fecharVenda(); e.preventDefault(); } else if(tela==='receber'){ voltar(); e.preventDefault(); } return; }
  if(e.key==='F4'){ e.preventDefault(); if(tela==='venda') concluirVenda('pix'); else if(tela==='receber') receberPix(); return; }
  if(e.key==='F9'){ e.preventDefault(); if(tela==='venda') concluirVenda(); else if(tela==='receber') confirmarRecebimento(); return; }
  if(e.key==='F2'){ e.preventDefault(); if(dk) setModo('venda'); else if(!tela) abrirVenda(); return; }
  if(e.key==='F3'){ e.preventDefault(); if(dk) setModo('receber'); return; }
  if(e.key==='/' && !digitando){ const i=$('#dBusca')||$('#fBusca')||$('#vBusca'); if(i){ e.preventDefault(); i.focus(); } return; }
  if(e.key==='Enter' && digitando){
    const id=document.activeElement.id;
    if(id==='rValor'||id==='rData'){ e.preventDefault(); confirmarRecebimento(); }
    else if(id==='vRec'){ e.preventDefault(); concluirVenda(); }
    else if(id==='fBusca' && primeiroId){ e.preventDefault(); abrirReceber(primeiroId); }
    else if(id==='vBusca'){ e.preventDefault(); const b=document.querySelector('#vProds .prod, #vProds tbody tr'); if(b){ addProd(b.dataset.id); document.activeElement.select(); } }
  }
});
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
iniciar();
